<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vehicle Insurance Eligibility</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f6f7fb;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
      padding: 24px 28px 32px;
    }

    /* HEADER */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 32px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    .header a {
      color: #374151;
      font-size: 22px;
      text-decoration: none;
    }

    .header a:hover { color: #2563eb; }

    .header .left { justify-self: start; }
    .header .right { justify-self: end; }

    /* SECTIONS */
    .section { margin-bottom: 28px; }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 20px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* TOGGLE */
    .toggle-group {
      display: flex;
      gap: 10px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      cursor: pointer;
      font-weight: 600;
    }

    .toggle-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    /* ACTION */
    .actions {
      margin-top: 32px;
    }

    .primary-btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* RESULT */
    .result {
      margin-top: 28px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      color: #1e40af;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .header h1 { font-size: 20px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">

      <!-- HEADER -->
      <div class="header">
        <a class="left" href="https://github.com/tripathishaurya" target="_blank">
          <i class="fa-brands fa-github"></i>
        </a>

        <h1>Vehicle Insurance Eligibility</h1>

        <a class="right" href="https://www.linkedin.com/in/shaurya-tripathi-4b78a9274/" target="_blank">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </div>

      <form method="post" action="/">

        <!-- PERSONAL -->
        <div class="section">
          <div class="section-title">Personal Information</div>

          <label>Gender</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn active" data-value="1">Male</button>
            <button type="button" class="toggle-btn" data-value="0">Female</button>
          </div>
          <input type="hidden" name="Gender" id="Gender" value="1">

          <div class="grid" style="margin-top:16px;">
            <div>
              <label>Age</label>
              <input type="number" name="Age" required />
            </div>
            <div>
              <label>Driving License</label>
              <select name="Driving_License" required>
                <option value="">Select</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
          </div>
        </div>

        <!-- VEHICLE -->
        <div class="section">
          <div class="section-title">Vehicle Information</div>

          <div class="grid">
            <div>
              <label>Vehicle Damage</label>
              <select name="Vehicle_Damage_Yes" required>
                <option value="">Select</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
            <div>
              <label>Previously Insured</label>
              <select name="Previously_Insured" required>
                <option value="">Select</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
            <div>
              <label>Vehicle Age &lt; 1 Year</label>
              <select name="Vehicle_Age_lt_1_Year" required>
                <option value="">Select</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
            <div>
              <label>Vehicle Age &gt; 2 Years</label>
              <select name="Vehicle_Age_gt_2_Years" required>
                <option value="">Select</option>
                <option value="1">Yes</option>
                <option value="0">No</option>
              </select>
            </div>
          </div>
        </div>

        <!-- POLICY -->
        <div class="section">
          <div class="section-title">Policy Details</div>

          <div class="grid">
            <div>
              <label>Annual Premium</label>
              <input type="number" step="0.01" name="Annual_Premium" required />
            </div>
            <div>
              <label>Policy Sales Channel</label>
              <select name="Policy_Sales_Channel" required>
                <option value="">Select</option>
                <option value="1">Agent</option>
                <option value="2">Online</option>
                <option value="3">Bank</option>
              </select>
            </div>
            <div>
              <label>Region Code</label>
              <input type="number" name="Region_Code" required />
            </div>
            <div>
              <label>Vintage (days)</label>
              <input type="number" name="Vintage" required />
            </div>
          </div>
        </div>

        <!-- ACTION -->
        <div class="actions">
          <button type="submit" class="primary-btn">Check Eligibility</button>
        </div>
      </form>

      {% if context %}
      <div class="result">
        Prediction Result: {{ context }}
      </div>
      {% endif %}

    </div>
  </div>

  <!-- INLINE JS -->
  <script>
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.parentElement.querySelectorAll('.toggle-btn')
          .forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('Gender').value = btn.dataset.value;
      });
    });
  </script>
</body>
</html>
